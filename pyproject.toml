[project]
name = "novel-engine"
version = "0.1.0"
description = "Novel Narrative Engine - 长篇玄幻小说自动生成与管理系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx[socks]>=0.27",
    "langgraph>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "greenlet>=3.0",
    "jsonschema>=4.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = '-m "not integration and not soak and not slow_soak"'
markers = [
    "integration: tests hitting a real LLM endpoint (opt-in via NOVEL_LLM_API_KEY)",
    "soak: long-horizon committed story simulation (pytest -m soak)",
    "slow_soak: 20-chapter soak (rarely run locally)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
